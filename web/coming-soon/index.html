<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Nosko — Coming Soon</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, "Helvetica Neue", sans-serif;
        background:
          radial-gradient(1200px 800px at 70% -10%, #1a2340 0%, transparent 60%),
          radial-gradient(900px 600px at 10% 110%, #0f1a33 0%, transparent 55%),
          #0a0f1f;
        color: #e6ecff;
        display: grid;
        place-items: center;
        padding: 2rem;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 34rem;
        text-align: center;
      }
      .brand {
        font-size: 0.85rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #8ea3d6;
        margin-bottom: 2.5rem;
      }
      h1 {
        font-size: clamp(2.25rem, 6vw, 3.75rem);
        line-height: 1.05;
        font-weight: 700;
        margin: 0 0 1.25rem;
        background: linear-gradient(180deg, #ffffff 0%, #b9c7ee 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        font-size: 1.1rem;
        line-height: 1.6;
        color: #aab6d4;
        margin: 0;
      }
      footer {
        margin-top: 3rem;
        font-size: 0.8rem;
        color: #5f6a8a;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Nosko</div>
      <h1>Something good is on the way.</h1>
      <p>
        We're building a better way for couples to plan their finances together.
        Check back soon.
      </p>
      <footer>&copy; Nosko</footer>
    </main>
  </body>
</html>
